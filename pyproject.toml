[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-search"
version = "0.2.0"
description = "PDF question answering with Qdrant, page citations and abstention."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "inngest>=0.5.17",
    "numpy>=1.26",
    "pydantic>=2",
    "pypdf>=5",
    "python-dotenv>=1.0",
    "qdrant-client>=1.13",
    "scikit-learn>=1.5",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["fpdf2>=2.8", "httpx>=0.27", "pytest>=8"]
ui = ["streamlit>=1.40"]
semantic = ["sentence-transformers>=3"]
generate = ["sentencepiece>=0.2", "torch>=2.4", "transformers>=4.45"]

[tool.setuptools]
py-modules = ["custom_types", "data_loader", "main", "rag_core", "vector_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
